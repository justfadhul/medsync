<title>Tether Kit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="components/bundle.css">
<style>
/* Layout: a component-library site in the kit's own clothes. Sticky top bar, a sidebar of pages, one page at a time
   (hash routes), a reading column with framed live canvases, and an on-this-page rail on wide screens. Every
   colour is a palette token (generated below from docs/tether-kit/palettes/jacaranda.json), light and dark. */
/*TOKENS*/
:root {
  --font-sans: "Figtree", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --bar-h: 60px;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 20px); }
body { background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-weight: 600; color: var(--ink); }
p { margin: 0; }
/* The site's own styles never reach the live kit parts (inside [data-pw]): unlayered page CSS would outrank them. */
a:where(:not([data-pw] *)) { color: var(--accent-text); text-underline-offset: 3px; }
code, .mono { font-family: var(--font-mono); font-size: 0.88em; }
:not(pre) > code { background: var(--surface-3); color: var(--ink); padding: 1px 6px; border-radius: 6px; }
:where(:not([data-pw] *)):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ico { display: inline-block; width: 16px; height: 16px; flex: none; vertical-align: -3px; }
button:where(:not([data-pw] *)) { font-family: inherit; }

/* ── Top bar ── */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--bar-h);
  background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(18px) saturate(160%); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 1440px; height: 100%; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: baseline; gap: 2px; text-decoration: none; color: var(--ink); font-weight: 700; font-size: 20px; letter-spacing: -0.03em; }
.brand span { font-weight: 500; color: var(--ink-3); letter-spacing: -0.01em; }
.ver { font-size: 12px; font-weight: 600; color: var(--ink-2); border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.pal { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.pal i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--line-strong); }
.grow { flex: 1; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--surface-3); }
.seg button { font: 600 13px var(--font-sans); color: var(--ink-2); background: transparent; border: 0; border-radius: 999px; height: 28px; padding: 0 11px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; transition: background-color 150ms var(--ease), color 150ms var(--ease), box-shadow 150ms var(--ease); }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); box-shadow: var(--shadow-card); }
.bar .ds { font-weight: 600; font-size: 13.5px; text-decoration: none; padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
.bar .ds:hover { background: var(--accent-tint); }
.menu-btn { display: none; font: 600 14px var(--font-sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px; height: 34px; padding: 0 14px; cursor: pointer; }

/* ── Shell ── */
.shell { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: 256px minmax(0, 1fr); gap: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h)); align-self: start; height: calc(100svh - var(--bar-h) - env(safe-area-inset-top, 0px));
  overflow-y: auto; padding: 22px 18px 40px 4px; border-right: 1px solid var(--line); }
.search { position: relative; margin-bottom: 18px; }
.search input { width: 100%; height: 38px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font: 500 14px var(--font-sans); padding: 0 52px 0 36px; outline: none; transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease); }
.search input::placeholder { color: var(--ink-3); }
.search input:focus { border-color: var(--focus); box-shadow: 0 0 0 3px var(--accent-tint); }
.search .ico { position: absolute; left: 12px; top: 11px; color: var(--ink-3); }
.search kbd { position: absolute; right: 9px; top: 9px; font: 600 11px var(--font-sans); color: var(--ink-3); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; background: var(--surface-2); }
.nav-group { margin-bottom: 18px; }
.nav-h { font-size: 11.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); padding: 0 10px 6px; display: flex; align-items: center; gap: 8px; }
.nav-h .st { letter-spacing: 0; text-transform: none; }
.side a { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 14px; }
.side a:hover { background: var(--surface-3); color: var(--ink); }
.side a[aria-current="page"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-card); }
.side a[aria-current="page"]::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-text); margin-left: -2px; }
.side .none { padding: 6px 10px; color: var(--ink-3); font-size: 13.5px; }

.st { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.st.review { background: var(--accent-tint); color: var(--accent-text); }
.st.planned { background: var(--surface-3); color: var(--ink-2); }

.content { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 48px; padding: 40px 0 96px 48px; }
.content.wide { grid-template-columns: minmax(0, 1fr); }
main { min-width: 0; max-width: 940px; }
.content.wide main { max-width: 1120px; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 40px); align-self: start; display: flex; flex-direction: column; gap: 2px; }
.toc .h { font-size: 11.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.toc button { all: unset; cursor: pointer; font-size: 13.5px; color: var(--ink-2); padding: 4px 0 4px 12px; border-left: 2px solid var(--line); }
.toc button:hover { color: var(--ink); }
.toc button.on { color: var(--ink); border-left-color: var(--accent-text); font-weight: 600; }
.toc button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

/* ── Page type ── */
.crumbs { font-size: 13px; color: var(--ink-3); margin-bottom: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.page-h { display: flex; flex-direction: column; gap: 12px; margin-bottom: 36px; }
.page-h h1 { font-size: 40px; line-height: 1.1; letter-spacing: -0.035em; font-weight: 600; }
.lede { font-size: 17px; line-height: 1.6; color: var(--ink-2); max-width: 66ch; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--ink-2); align-items: center; }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.meta code { font-size: 12px; }
section.block { margin-top: 48px; scroll-margin-top: calc(var(--bar-h) + 24px); }
section.block > h2 { font-size: 24px; letter-spacing: -0.02em; margin-bottom: 6px; }
section.block > p.sub { color: var(--ink-2); margin-bottom: 18px; max-width: 70ch; }
h3.sub-h { font-size: 16px; margin: 26px 0 10px; }
.prose { display: flex; flex-direction: column; gap: 12px; max-width: 70ch; }
.prose ul, .prose ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; list-style: disc; }

/* ── Live canvases ── */
.frame { border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--surface); margin-top: 14px; position: relative; }
.frame-bar { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 16px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.frame-bar .t { font-size: 13.5px; font-weight: 600; flex: 1; min-width: 120px; }
.frame-bar .seg button { height: 26px; font-size: 12.5px; padding: 0 10px; }
.stage { background-color: var(--bg); background-image: radial-gradient(color-mix(in srgb, var(--ink) 9%, transparent) 1px, transparent 1px); background-size: 18px 18px; }
.stage > div { min-height: 120px; padding: 28px; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
.stage.center > div { align-items: center; }
.stage > div > div[data-pw] { background: transparent; }
.code-pane { border-top: 1px solid var(--line); position: relative; background: var(--surface-2); }
.code-pane[hidden] { display: none; }
.frame > .code-pane:first-child { border-top: 0; }
pre { margin: 0; padding: 16px 18px; padding-right: 80px; overflow-x: auto; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.75; color: var(--ink); }
pre .k { color: var(--accent-text); } pre .s { color: var(--ink-2); } pre .t { color: var(--ink); font-weight: 600; } pre .c { color: var(--ink-3); }
.copy { position: absolute; top: 8px; right: 8px; font: 600 12.5px var(--font-sans); color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
.copy:hover { color: var(--ink); border-color: var(--line-strong); }
.ex-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
.ex-col { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 460px; margin: 0 auto; }

/* Playground */
.play { display: grid; grid-template-columns: minmax(0, 1fr) 270px; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--surface); }
.play .stage > div { min-height: 280px; align-items: center; }
.controls { border-left: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 16px; background: var(--surface); }
.ctl { display: flex; flex-direction: column; gap: 7px; }
.ctl[hidden] { display: none; }
.ctl > span, .ctl > label { font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); }
.ctl .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.ctl .opts button { font: 600 12.5px var(--font-sans); color: var(--ink-2); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px 11px; cursor: pointer; transition: background-color 150ms var(--ease), color 150ms var(--ease), border-color 150ms var(--ease); }
.ctl .opts button:hover { color: var(--ink); }
.ctl .opts button[aria-pressed="true"] { background: var(--band); border-color: var(--band); color: var(--on-band); }
.ctl input[type="text"] { height: 34px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 0 10px; font: 500 14px var(--font-sans); outline: none; }
.ctl input[type="text"]:focus { border-color: var(--focus); box-shadow: 0 0 0 3px var(--accent-tint); }
.play .code-pane { grid-column: 1 / -1; }

/* Do / Don't */
.dd { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 14px; }
.dd figure { margin: 0; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface); display: flex; flex-direction: column; }
.dd .stage { flex: 1; }
.dd .stage > div { min-height: 130px; padding: 22px; align-items: center; }
.dd figcaption { padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); font-size: 14px; }
.dd figcaption b { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; letter-spacing: 0.02em; }
.dd figcaption b svg { width: 15px; height: 15px; display: inline-block; }
.dd .dont figcaption b { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.dd figcaption span { color: var(--ink-2); }

/* Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); margin-top: 14px; }
table { border-collapse: collapse; width: 100%; min-width: 600px; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); padding: 10px 16px; background: var(--surface-2); }
td { padding: 11px 16px; border-top: 1px solid var(--line); vertical-align: top; }
td code { white-space: nowrap; }
td.muted { color: var(--ink-2); }
.req { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink); border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 5px; margin-left: 6px; }

/* A11y list */
.a11y { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.a11y li { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.a11y b { font-size: 14px; }
.a11y span { color: var(--ink-2); font-size: 14px; }
.ratio { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }

/* Overview */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 48px; align-items: center; margin-bottom: 20px; }
.hero h1 { font-size: 50px; line-height: 1.03; letter-spacing: -0.04em; font-weight: 600; }
.hero .lede { margin-top: 18px; }
.cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
.cta a { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 20px; border-radius: 999px; font-weight: 600; text-decoration: none; transition: filter 150ms var(--ease), background-color 150ms var(--ease); }
.cta a.p { background: var(--act); color: var(--on-act); }
.cta a.p:hover { filter: brightness(1.12); }
.cta a.s { background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); }
.cta a.s:hover { background: var(--surface-2); }
.hero-art { border-radius: 30px; padding: 22px; background-color: var(--surface-2); background-image: radial-gradient(color-mix(in srgb, var(--ink) 9%, transparent) 1px, transparent 1px); background-size: 18px 18px; border: 1px solid var(--line); }
.spec { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.spec-cell { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.spec-cell.wide { grid-column: 1 / -1; }
.spec-cell > span { font-size: 11.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); }
.spec-cell [data-pw] { background: transparent; }
.spec-cell .ex-row { justify-content: flex-start; }
.spec-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: end; }
.spec-pair small { display: block; font-size: 12px; color: var(--ink-3); margin-top: 6px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 44px; }
.stats div { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.stats b { display: block; font-size: 26px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stats span { font-size: 13.5px; color: var(--ink-2); }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 14px; }
.ccard { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--surface); text-decoration: none; color: inherit;
  transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease); }
.ccard:hover { border-color: var(--line-strong); box-shadow: var(--shadow-card); }
.ccard .stage > div { min-height: 140px; padding: 20px; align-items: center; pointer-events: none; }
.ccard .cbody { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); }
.ccard .cbody .row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.ccard b { font-size: 15.5px; }
.ccard span.d { color: var(--ink-2); font-size: 14px; }
.princ { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
.princ div { background: var(--surface); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 4px; }
.princ b { font-size: 15px; }
.princ span { color: var(--ink-2); font-size: 14px; }

/* Foundations */
.swgroup { margin-top: 30px; }
.swgroup h3 { font-size: 16px; margin-bottom: 4px; }
.swgroup > p { color: var(--ink-2); font-size: 14px; margin-bottom: 12px; max-width: 70ch; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 10px; }
.sw { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
.sw .chip { height: 64px; border-bottom: 1px solid var(--line); }
.sw .info { padding: 9px 11px 11px; display: flex; flex-direction: column; gap: 1px; }
.sw .info b { font-size: 13px; }
.sw .info code { background: none; padding: 0; font-size: 11.5px; color: var(--ink-2); }
.sw .info span { font-size: 12px; color: var(--ink-2); line-height: 1.4; margin-top: 3px; }
.story { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 4px; }
.story > div { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.story i { width: 30px; height: 30px; border-radius: 9px; flex: none; border: 1px solid var(--line); }
.story b { font-size: 14px; display: block; }
.story span { font-size: 13px; color: var(--ink-2); }
.type-row { display: grid; grid-template-columns: 130px minmax(0, 1fr) 170px; gap: 16px; align-items: baseline; padding: 14px 16px; border-top: 1px solid var(--line); }
.type-row:first-child { border-top: 0; }
.type-row .nm { font-size: 13px; font-weight: 600; font-family: var(--font-mono); }
.type-row .spec { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; }
.type-list { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; }
.scale { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.scale div { display: grid; grid-template-columns: 90px 60px minmax(0, 1fr); gap: 12px; align-items: center; font-size: 13px; }
.scale i { display: block; height: 12px; border-radius: 4px; background: var(--accent); max-width: 100%; }
.radii { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-top: 4px; }
.radii div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.radii div span { color: var(--ink-2); font-size: 12.5px; }
.radii i { width: 64px; height: 48px; background: var(--accent-tint); border: 2px solid var(--accent-text); border-bottom: 0; border-right: 0; }
.shadows { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px; margin-top: 4px; }
.shadows div { background: var(--surface); border-radius: 18px; padding: 18px; min-height: 100px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; font-size: 13px; color: var(--ink-2); }
.shadows b { font-size: 14px; color: var(--ink); font-family: var(--font-mono); font-weight: 600; }
.motion { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 28px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
.motion svg { width: 100%; height: auto; }
.tracks { display: flex; flex-direction: column; gap: 14px; }
.track { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; align-items: center; font-size: 13px; color: var(--ink-2); }
.track b { color: var(--ink); }
.track .lane { height: 28px; border-radius: 999px; background: var(--surface-3); position: relative; }
.track .dot { position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); transition-property: left; transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
.track .lane.go .dot { left: calc(100% - 24px); }
.play-btn { font: 600 13.5px var(--font-sans); background: var(--act); color: var(--on-act); border: 0; border-radius: 999px; height: 36px; padding: 0 18px; cursor: pointer; justify-self: start; align-self: flex-start; }
